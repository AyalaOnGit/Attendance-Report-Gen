[project]
name = "reportgen"
version = "1.0.0"
description = "Attendance PDF report processor with OCR, transformation, and export"
requires-python = ">=3.12"
dependencies = [
    "pytesseract",
    "pymupdf",
    "pillow",
    "pandas",
    "openpyxl",
    "pdfkit",
    "jinja2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
